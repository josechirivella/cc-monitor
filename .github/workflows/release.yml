name: Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: macos-26

    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      - name: Build and validate universal release archive
        run: |
          make release-archive \
            BUNDLE="dist/CCMonitor.app" \
            VERSION="0.0.0" \
            BUILD_NUMBER="0"
          make validate-release \
            BUNDLE="dist/CCMonitor.app" \
            VERSION="0.0.0" \
            BUILD_NUMBER="0"

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate release version
        id: version
        run: |
          version="$(scripts/next-version.sh "$GITHUB_SHA")"
          build_number="$(git rev-list --count "$GITHUB_SHA")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'build_number=%s\n' "$build_number" >> "$GITHUB_OUTPUT"

      - name: Build universal release archive
        run: |
          make release-archive \
            BUNDLE="dist/CCMonitor.app" \
            VERSION="${{ steps.version.outputs.version }}" \
            BUILD_NUMBER="${{ steps.version.outputs.build_number }}"

      - name: Validate release archive
        run: |
          make validate-release \
            BUNDLE="dist/CCMonitor.app" \
            VERSION="${{ steps.version.outputs.version }}" \
            BUILD_NUMBER="${{ steps.version.outputs.build_number }}"

      - name: Create or reuse release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: dist/CCMonitor-v${{ steps.version.outputs.version }}-macos-universal.zip
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" --generate-notes --title "$TAG"
          fi
