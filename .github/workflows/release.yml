name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        id: version
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build universal release archive
        run: |
          make release-archive \
            BUNDLE="dist/CCMonitor.app" \
            VERSION="${{ steps.version.outputs.version }}" \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Validate release archive
        run: |
          make validate-release \
            BUNDLE="dist/CCMonitor.app" \
            VERSION="${{ steps.version.outputs.version }}" \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Create or reuse release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: dist/CCMonitor-v${{ steps.version.outputs.version }}-macos-universal.zip
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" --generate-notes --title "$TAG"
          fi
